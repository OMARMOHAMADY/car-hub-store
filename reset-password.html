<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password · CarHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page-section form-section">
        <div class="container">
            <div class="form-box">
                <h1>Create a new password</h1>
                <p>Choose a strong password for your account.</p>
                <form id="resetPasswordForm">
                    <label class="field">
                        <span>New Password</span>
                        <input type="password" name="password" required>
                    </label>
                    <label class="field">
                        <span>Confirm Password</span>
                        <input type="password" name="confirm" required>
                    </label>
                    <button type="submit" class="button button-primary">Reset Password</button>
                    <div id="resetMessage" style="margin-top:12px; display:none;"></div>
                </form>
            </div>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('token');
        const form = document.getElementById('resetPasswordForm');
        const message = document.getElementById('resetMessage');
        if (!token) {
            message.textContent = 'Missing reset token.';
            message.style.display = 'block';
            message.style.color = 'var(--toast-error)';
            return;
        }
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.style.display = 'none';
            const password = form.querySelector('input[name="password"]').value;
            const confirm = form.querySelector('input[name="confirm"]').value;
            if (password !== confirm) {
                message.textContent = 'Passwords do not match.';
                message.style.display = 'block';
                message.style.color = 'var(--toast-error)';
                return;
            }
            try {
                const data = await CarHubAuth.resetPassword(token, password);
                message.textContent = data.message;
                message.style.display = 'block';
                message.style.color = 'var(--toast-success)';
                form.reset();
            } catch (err) {
                message.textContent = err.message;
                message.style.display = 'block';
                message.style.color = 'var(--toast-error)';
            }
        });
    });
    </script>
</body>
</html>
