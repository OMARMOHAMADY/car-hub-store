<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · CarHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="logo" href="index.html"><i class="fa-solid fa-car"></i>CarHub</a>
        <button class="mobile-menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="header-actions">
            <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="cars.html">Cars</a>
            <a href="sell-car.html">Sell</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="action-buttons">
            <a class="button button-outline" href="login.html" id="loginNavBtn">Login</a>
            <a class="button button-primary" href="register.html" id="registerNavBtn">Register</a>
            <a href="cart.html" class="cart-badge" id="cartBadge" style="display:inline-flex;" aria-label="Cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge-label">Cart</span>
                <span class="cart-badge-count" id="cartBadgeCount">0</span>
            </a>
            <div class="user-badge" id="userBadge" style="display:none;">
                <button class="user-badge-toggle" type="button" aria-haspopup="true" aria-expanded="false">
                    <span class="user-badge-avatar" id="userBadgeAvatar">U</span>
                    <span class="user-badge-name" id="userBadgeName">User</span>
                    <i class="fa-solid fa-chevron-down user-badge-caret"></i>
                </button>
                <div class="user-badge-dropdown">
                    <a href="dashboard.html" class="user-badge-item"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
                    <button type="button" class="user-badge-item user-badge-logout" id="userBadgeLogout"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
            <button id="themeToggle" class="button button-outline" type="button" aria-label="Toggle theme">Light Mode</button>
            <select id="langSelect" class="button button-outline lang-selector" aria-label="Language selector">
                <option value="en">English</option>
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
            </select>
        </div>
        </div>
    </div>
</header>
<main class="page-section form-section">
    <div class="container">
        <div class="form-box">
            <h1>Create Account</h1>
            <p>Join CarHub and start selling or buying cars with a beautiful, secure marketplace.</p>
            <form id="registerForm">
                <div class="form-grid">
                    <div class="col">
                        <label class="field">
                            <span>Full Name</span>
                            <input type="text" name="name" placeholder="Your full name" required>
                        </label>

                        <label class="field">
                            <span>Email</span>
                            <input type="email" name="email" placeholder="you@domain.com" required>
                        </label>

                        <label class="field">
                            <span>Password</span>
                            <div class="input-with-toggle">
                                <input id="regPassword" type="password" name="password" placeholder="Create a password" required>
                                <button type="button" class="toggle-pass" data-target="regPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                            </div>
                        </label>

                        <label class="field">
                            <span>Confirm Password</span>
                            <input id="regPasswordConfirm" type="password" name="confirm" placeholder="Repeat password" required>
                        </label>

                        <div class="form-actions">
                            <button type="submit" class="button button-primary" id="registerSubmitBtn">Create Account</button>
                            <a href="login.html" class="button button-outline">Sign in</a>
                        </div>
                        <div id="registerError" style="color:var(--toast-error); margin-top:12px; display:none;"></div>
            </form>
            <p class="form-footer" style="margin-top:12px; color:var(--muted);">
                By creating an account you agree to our <a href="#">Terms</a>.
            </p>
        </div>
</main>
<footer class="page-footer">
    <div class="container">
        <p>CarHub · Modern car marketplace demo</p>
    </div>
</footer>
<script src="js/auth.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (CarHubAuth.isLoggedIn()) {
        window.location.href = 'dashboard.html';
        return;
    }

    const registerForm = document.getElementById('registerForm');
    const registerError = document.getElementById('registerError');
    const submitBtn = document.getElementById('registerSubmitBtn');

    if (registerForm) {
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            registerError.style.display = 'none';

            const pass = registerForm.querySelector('input[name="password"]').value;
            const confirm = registerForm.querySelector('input[name="confirm"]').value;
            if (pass !== confirm) {
                registerError.textContent = 'Passwords do not match.';
                registerError.style.display = 'block';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const name = registerForm.querySelector('input[name="name"]').value;
                const email = registerForm.querySelector('input[name="email"]').value;
                await CarHubAuth.register(name, email, pass);
                window.location.href = 'dashboard.html';
            } catch (err) {
                registerError.textContent = err.message;
                registerError.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Create Account';
            }
        });
    }
});
</script>
<script src="js/app.js"></script>
</body>
</html>
