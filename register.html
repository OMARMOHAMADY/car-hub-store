<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · CarHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="logo" href="index.html"><i class="fa-solid fa-car"></i>CarHub</a>
        <button class="mobile-menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="header-actions">
            <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="cars.html">Cars</a>
            <a href="sell-car.html">Sell</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="action-buttons">
            <a class="button button-outline" href="login.html">Login</a>
            <a class="button button-primary" href="register.html">Register</a>
            <button id="themeToggle" class="button button-outline" type="button" aria-label="Toggle theme">Light Mode</button>
            <select id="langSelect" class="button button-outline lang-selector" aria-label="Language selector">
                <option value="en">English</option>
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
            </select>
        </div>
    </div>
</header>
<main class="page-section form-section">
    <div class="container">
        <div class="form-box">
            <h1>Create Account</h1>
            <p>Join CarHub and start selling or buying cars with a beautiful, secure marketplace.</p>
            <form id="registerForm">
                <div class="form-grid">
                    <div class="col">
                        <label class="field">
                            <span>Full Name</span>
                            <input type="text" name="name" placeholder="Your full name" required>
                        </label>

                        <label class="field">
                            <span>Email</span>
                            <input type="email" name="email" placeholder="you@domain.com" required>
                        </label>

                        <label class="field">
                            <span>Password</span>
                            <div class="input-with-toggle">
                                <input id="regPassword" type="password" name="password" placeholder="Create a password" required>
                                <button type="button" class="toggle-pass" data-target="regPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                            </div>
                        </label>

                        <label class="field">
                            <span>Confirm Password</span>
                            <input id="regPasswordConfirm" type="password" name="confirm" placeholder="Repeat password" required>
                        </label>

                        <div class="form-actions">
                            <button type="submit" class="button button-primary">Create Account</button>
                            <a href="login.html" class="button button-outline">Sign in</a>
                        </div>
                </div>
            </form>
            <p class="form-footer" style="margin-top:12px; color:var(--muted);">
                By creating an account you agree to our <a href="#">Terms</a>.
            </p>
        </div>
</main>
<footer class="page-footer">
    <div class="container">
        <p>CarHub · Modern car marketplace demo</p>
    </div>
</footer>
<script>
    const translations = {
        en: {
            title: 'Register · CarHub',
            heading: 'Create Account',
            desc: 'Join CarHub and start selling or buying cars with a beautiful, secure marketplace.',
            nameLabel: 'Full Name',
            namePlaceholder: 'Your full name',
            emailLabel: 'Email',
            emailPlaceholder: 'you@domain.com',
            passwordLabel: 'Password',
            passwordPlaceholder: 'Create a password',
            confirmLabel: 'Confirm Password',
            confirmPlaceholder: 'Repeat password',
            createAccount: 'Create Account',
            signIn: 'Sign in',
            footerText: 'CarHub · Modern car marketplace demo',
            login: 'Login',
            register: 'Register',
            termsText: 'By creating an account you agree to our',
            terms: 'Terms'
        },
        ar: {
            title: 'التسجيل · CarHub',
            heading: 'إنشاء حساب',
            desc: 'انضم إلى CarHub وابدأ في بيع أو شراء السيارات من خلال سوق جميل وآمن.',
            nameLabel: 'الاسم الكامل',
            namePlaceholder: 'اسمك الكامل',
            emailLabel: 'البريد الإلكتروني',
            emailPlaceholder: 'you@domain.com',
            passwordLabel: 'كلمة المرور',
            passwordPlaceholder: 'إنشاء كلمة مرور',
            confirmLabel: 'تأكيد كلمة المرور',
            confirmPlaceholder: 'أعد كتابة كلمة المرور',
            createAccount: 'إنشاء حساب',
            signIn: 'تسجيل الدخول',
            footerText: 'CarHub · سوق سيارات حديث تجريبي',
            login: 'تسجيل الدخول',
            register: 'التسجيل',
            termsText: 'بإنشاء حساب فإنك توافق على',
            terms: 'الشروط'
        },
        fr: {
            title: 'Inscription · CarHub',
            heading: 'Creer un compte',
            desc: 'Rejoignez CarHub et commencez a vendre ou acheter des voitures sur un marche magnifique et securise.',
            nameLabel: 'Nom complet',
            namePlaceholder: 'Votre nom complet',
            emailLabel: 'Email',
            emailPlaceholder: 'you@domain.com',
            passwordLabel: 'Mot de passe',
            passwordPlaceholder: 'Creer un mot de passe',
            confirmLabel: 'Confirmer le mot de passe',
            confirmPlaceholder: 'Repetez le mot de passe',
            createAccount: 'Creer un compte',
            signIn: 'Connexion',
            footerText: 'CarHub · Demo de marche automobile moderne',
            login: 'Connexion',
            register: 'Inscription',
            termsText: 'En creant un compte, vous acceptez nos',
            terms: 'Conditions'
        }
    };

    function updateLanguage(lang) {
        const strings = translations[lang] || translations.en;
        document.title = strings.title;
        document.documentElement.lang = lang;
        document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';

        const h1 = document.querySelector('.form-box h1');
        if (h1) h1.textContent = strings.heading;
        const desc = document.querySelector('.form-box > p');
        if (desc) desc.textContent = strings.desc;

        const labels = document.querySelectorAll('.field span');
        if (labels[0]) labels[0].textContent = strings.nameLabel;
        if (labels[1]) labels[1].textContent = strings.emailLabel;
        if (labels[2]) labels[2].textContent = strings.passwordLabel;
        if (labels[3]) labels[3].textContent = strings.confirmLabel;

        const inputs = document.querySelectorAll('.field input');
        if (inputs[0]) inputs[0].placeholder = strings.namePlaceholder;
        if (inputs[1]) inputs[1].placeholder = strings.emailPlaceholder;
        if (inputs[2]) inputs[2].placeholder = strings.passwordPlaceholder;
        if (inputs[3]) inputs[3].placeholder = strings.confirmPlaceholder;

        const createBtn = document.querySelector('.form-actions .button-primary');
        if (createBtn) createBtn.textContent = strings.createAccount;
        const signInBtn = document.querySelector('.button-outline[href="login.html"]');
        if (signInBtn) signInBtn.textContent = strings.signIn;

        const footerP = document.querySelector('.page-footer p');
        if (footerP) footerP.textContent = strings.footerText;

        const loginLink = document.querySelector('.button-outline[href="login.html"]');
        if (loginLink) loginLink.textContent = strings.login;

        const termsP = document.querySelector('.form-footer');
        if (termsP) termsP.innerHTML = strings.termsText + ' <a href="#">' + strings.terms + '</a>.';

        const langSelect = document.getElementById('langSelect');
        if (langSelect) langSelect.value = lang;
        localStorage.setItem('siteLanguage', lang);
    }

    const savedLang = localStorage.getItem('siteLanguage') || 'en';
    updateLanguage(savedLang);

    const langSelect = document.getElementById('langSelect');
    if (langSelect) {
        langSelect.addEventListener('change', function(event) {
            updateLanguage(event.target.value);
        });
    }
</script>
<script src="js/app.js"></script>
</body>
</html>
