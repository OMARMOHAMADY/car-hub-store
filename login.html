<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · CarHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="logo" href="index.html"><i class="fa-solid fa-car"></i>CarHub</a>
        <button class="mobile-menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="header-actions">
            <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="cars.html">Cars</a>
            <a href="sell-car.html">Sell</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="action-buttons">
            <a class="button button-outline" href="login.html" id="loginNavBtn">Login</a>
            <a class="button button-primary" href="register.html" id="registerNavBtn">Register</a>
            <a href="cart.html" class="cart-badge" id="cartBadge" style="display:inline-flex;" aria-label="Cart">
                <i class="fa-solid fa-cart-shopping"></i>
                <span class="cart-badge-label">Cart</span>
                <span class="cart-badge-count" id="cartBadgeCount">0</span>
            </a>
            <div class="user-badge" id="userBadge" style="display:none;">
                <button class="user-badge-toggle" type="button" aria-haspopup="true" aria-expanded="false">
                    <span class="user-badge-avatar" id="userBadgeAvatar">U</span>
                    <span class="user-badge-name" id="userBadgeName">User</span>
                    <i class="fa-solid fa-chevron-down user-badge-caret"></i>
                </button>
                <div class="user-badge-dropdown">
                    <a href="dashboard.html" class="user-badge-item"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
                    <button type="button" class="user-badge-item user-badge-logout" id="userBadgeLogout"><i class="fa-solid fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
            <button id="themeToggle" class="button button-outline" type="button" aria-label="Toggle theme">Light Mode</button>
            <select id="langSelect" class="button button-outline lang-selector" aria-label="Language selector">
                <option value="en">English</option>
                <option value="ar">العربية</option>
                <option value="fr">Français</option>
            </select>
        </div>
    </div>
    </div>
</header>
<main class="page-section form-section">
    <div class="container">
        <div class="form-box">
            <h1>Welcome Back</h1>
            <p>Sign in to your account and continue browsing top car listings.</p>
            <form id="loginForm">
                <div class="form-grid">
                    <div class="col">
                        <label class="field">
                            <span>Email</span>
                            <input type="email" name="email" placeholder="you@domain.com" required>
                        </label>

                        <label class="field">
                            <span>Password</span>
                            <div class="input-with-toggle">
                                <input id="loginPassword" type="password" name="password" placeholder="Password" required>
                                <button type="button" class="toggle-pass" data-target="loginPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                            </div>
                        </label>

                        <div class="form-actions">
<button type="submit" class="button button-primary" id="loginSubmitBtn">Login</button>
                            <a href="register.html" class="button button-outline">Create account</a>
                        </div>
                        <div id="loginError" style="color:var(--toast-error); margin-top:12px; display:none;"></div>
                </div>
            </form>
            <p class="form-footer" style="margin-top:12px; color:var(--muted);">
                Need help? <a href="contact.html">Contact support</a>
            </p>
        </div>
</main>
<footer class="page-footer">
    <div class="container">
        <p>CarHub · Modern car marketplace demo</p>
    </div>
</footer>
<script>
    const translations = {
        en: {
            title: 'Login · CarHub',
            heading: 'Welcome Back',
            desc: 'Sign in to your account and continue browsing top car listings.',
            emailLabel: 'Email',
            emailPlaceholder: 'you@domain.com',
            passwordLabel: 'Password',
            passwordPlaceholder: 'Password',
            loginBtn: 'Login',
            createAccount: 'Create account',
            footerText: 'CarHub · Modern car marketplace demo',
            login: 'Login',
            register: 'Register'
        },
        ar: {
            title: 'تسجيل الدخول · CarHub',
            heading: 'مرحبا بعودتك',
            desc: 'قم بتسجيل الدخول إلى حسابك واستمر في تصفح أفضل قوائم السيارات.',
            emailLabel: 'البريد الإلكتروني',
            emailPlaceholder: 'you@domain.com',
            passwordLabel: 'كلمة المرور',
            passwordPlaceholder: 'كلمة المرور',
            loginBtn: 'تسجيل الدخول',
            createAccount: 'إنشاء حساب',
            footerText: 'CarHub · سوق سيارات حديث تجريبي',
            login: 'تسجيل الدخول',
            register: 'التسجيل'
        },
        fr: {
            title: 'Connexion · CarHub',
            heading: 'Bon retour',
            desc: 'Connectez-vous a votre compte et continuez a parcourir les meilleures annonces de voitures.',
            emailLabel: 'Email',
            emailPlaceholder: 'you@domain.com',
            passwordLabel: 'Mot de passe',
            passwordPlaceholder: 'Mot de passe',
            loginBtn: 'Connexion',
            createAccount: 'Creer un compte',
            footerText: 'CarHub · Demo de marche automobile moderne',
            login: 'Connexion',
            register: 'Inscription'
        }
    };

    function updateLanguage(lang) {
        const strings = translations[lang] || translations.en;
        document.title = strings.title;
        document.documentElement.lang = lang;
        document.body.dir = lang === 'ar' ? 'rtl' : 'ltr';

        const h1 = document.querySelector('.form-box h1');
        if (h1) h1.textContent = strings.heading;
        const desc = document.querySelector('.form-box > p');
        if (desc) desc.textContent = strings.desc;

        const labels = document.querySelectorAll('.field span');
        if (labels[0]) labels[0].textContent = strings.emailLabel;
        if (labels[1]) labels[1].textContent = strings.passwordLabel;

        const inputs = document.querySelectorAll('.field input');
        if (inputs[0]) inputs[0].placeholder = strings.emailPlaceholder;
        if (inputs[1]) inputs[1].placeholder = strings.passwordPlaceholder;

        const loginBtn = document.querySelector('.form-actions .button-primary');
        if (loginBtn) loginBtn.textContent = strings.loginBtn;
        const createBtn = document.querySelector('.button-outline[href="register.html"]');
        if (createBtn) createBtn.textContent = strings.createAccount;

        const footerP = document.querySelector('.page-footer p');
        if (footerP) footerP.textContent = strings.footerText;

        const loginLink = document.querySelector('.button-outline[href="login.html"]');
        if (loginLink) loginLink.textContent = strings.login;

        const langSelect = document.getElementById('langSelect');
        if (langSelect) langSelect.value = lang;
        localStorage.setItem('siteLanguage', lang);
    }

    const savedLang = localStorage.getItem('siteLanguage') || 'en';
    updateLanguage(savedLang);

    const langSelect = document.getElementById('langSelect');
    if (langSelect) {
        langSelect.addEventListener('change', function(event) {
            updateLanguage(event.target.value);
        });
    }
</script>

<div id="carhub-toast-container" class="toast-container" aria-hidden="true"></div>
<script type="module" src="js/toast.module.js"></script>
<script type="module" src="js/main.module.js"></script>
<script src="js/auth.js"></script>
<script src="js/login.helper.js"></script>
<script src="js/data.js"></script>
<script src="js/components.js"></script>
<script src="js/cart.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    if (CarHubAuth.isLoggedIn()) {
        window.location.href = 'dashboard.html';
        return;
    }

    const loginForm = document.getElementById('loginForm');
    const loginError = document.getElementById('loginError');
    const submitBtn = document.getElementById('loginSubmitBtn');

    if (loginForm) {
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';

            try {
                const email = loginForm.querySelector('input[name="email"]').value;
                const password = loginForm.querySelector('input[name="password"]').value;
                await CarHubAuth.login(email, password);
                window.location.href = 'dashboard.html';
            } catch (err) {
                loginError.textContent = err.message;
                loginError.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
    }
});
</script>
<script src="js/app.js"></script>
</body>
</html>
