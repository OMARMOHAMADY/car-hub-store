<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login · CarHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<header class="site-header">
    <div class="container header-inner">
        <a class="logo" href="index.html"><i class="fa-solid fa-car"></i>CarHub</a>
        <button class="mobile-menu-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="header-actions">
            <nav class="navbar">
            <a href="index.html">Home</a>
            <a href="cars.html">Cars</a>
            <a href="sell-car.html">Sell</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="action-buttons">
            <a class="button button-outline" href="login.html">Login</a>
            <a class="button button-primary" href="register.html">Register</a>`r`n                <button id="themeToggle" class="button button-outline" type="button" aria-label="Toggle theme">Light Mode</button>
        </div>
        </div>
    </div>
</header>
<main class="page-section form-section">
    <div class="container">
        <div class="form-box">
            <h1>Welcome Back</h1>
            <p>Sign in to your account and continue browsing top car listings.</p>
            <form id="loginForm">
                <div class="form-grid">
                    <div class="col">
                        <label class="field">
                            <span>Email</span>
                            <input type="email" name="email" placeholder="you@domain.com" required>
                        </label>

                        <label class="field">
                            <span>Password</span>
                            <div class="input-with-toggle">
                                <input id="loginPassword" type="password" name="password" placeholder="Password" required>
                                <button type="button" class="toggle-pass" data-target="loginPassword" aria-label="Show password"><i class="fa-regular fa-eye"></i></button>
                            </div>
                        </label>

                        <div class="form-actions">
                            <button type="submit" class="button button-primary">Login</button>
                            <a href="register.html" class="button button-outline">Create account</a>
                        </div>
                    </div>
                </div>
            </form>
            <p class="form-footer" style="margin-top:12px; color:var(--muted);">
                Need help? <a href="contact.html">Contact support</a>
            </p>
        </div>
    </div>
</main>
<footer class="page-footer">
    <div class="container">
        <p>CarHub · Modern car marketplace demo</p>
    </div>
</footer>
<script src="js/app.js"></script>
</body>
</html>
