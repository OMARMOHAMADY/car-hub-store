<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password · CarHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="page-section form-section">
        <div class="container">
            <div class="form-box">
                <h1>Reset your password</h1>
                <p>Enter your email and we will send reset instructions.</p>
                <form id="forgotPasswordForm">
                    <label class="field">
                        <span>Email</span>
                        <input type="email" name="email" placeholder="you@domain.com" required>
                    </label>
                    <button type="submit" class="button button-primary">Send Reset Link</button>
                    <a href="login.html" class="button button-outline" style="margin-left:8px;">Back to login</a>
                    <div id="forgotMessage" style="margin-top:12px; display:none;"></div>
                </form>
            </div>
        </div>
    </main>
    <script src="js/auth.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('forgotPasswordForm');
        const message = document.getElementById('forgotMessage');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            message.style.display = 'none';
            try {
                const email = form.querySelector('input[name="email"]').value;
                const data = await CarHubAuth.forgotPassword(email);
                message.textContent = data.message;
                message.style.display = 'block';
                message.style.color = 'var(--toast-success)';
            } catch (err) {
                message.textContent = err.message;
                message.style.display = 'block';
                message.style.color = 'var(--toast-error)';
            }
        });
    });
    </script>
</body>
</html>
